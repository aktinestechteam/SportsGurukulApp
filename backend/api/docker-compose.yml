services:
  db:
    image: postgres:16
    container_name: sportsgurukul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DBSPOTSGURUKUL}
      POSTGRES_USER: ${POSTGRES_USER:-sportsgurukul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SportsGurukul@Dev123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sportsgurukul_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportsgurukul} -d ${POSTGRES_DB:-DBSPOTSGURUKUL}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sportsgurukul_pgdata:
